name: Contract
on:
  push:
    branches: [main, dev]
  pull_request:

defaults:
  run:
    working-directory: contracts/satchel

jobs:
  check:
    name: Format, lint, unit tests, wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --tests -- -D warnings
      - run: cargo test
      - name: Install cargo-near 0.22.0
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - name: Build the wasm
        run: cargo near build non-reproducible-wasm --locked
      - uses: actions/upload-artifact@v4
        with:
          name: satchel-wasm
          path: contracts/satchel/target/near/satchel.wasm

  reproducible:
    name: Reproducible build and code hash
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Full history: cargo-near reads the commit it builds and records it (NEP-330).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install cargo-near 0.22.0
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - name: Build in the pinned Docker image
        run: cargo near build reproducible-wasm
      - name: Code hash
        working-directory: .
        run: |
          hash="$(node scripts/code-hash.mjs contracts/satchel/target/near/satchel.wasm)"
          echo "$hash" > contracts/satchel/target/near/satchel.code-hash.txt
          {
            echo "### Satchel reproducible build"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- code hash: \`$hash\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: satchel-reproducible-wasm
          path: |
            contracts/satchel/target/near/satchel.wasm
            contracts/satchel/target/near/satchel.code-hash.txt
          if-no-files-found: error
          retention-days: 90
