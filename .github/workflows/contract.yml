name: Contract
on:
  push:
    branches: [main, dev]
  pull_request:

defaults:
  run:
    working-directory: contracts/satchel

jobs:
  check:
    name: Format, lint, unit tests, wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show
      - run: cargo fmt --check
      - run: cargo clippy --tests -- -D warnings
      - run: cargo test
      # The release binary itself, checked against the sha256 that cargo-near's own 0.22.0 installer
      # pins. GitHub's release downloads sometimes answer runners with a 504 and that installer does not
      # retry, so download it here with retries; the step fails if the file never arrives or differs.
      - name: Install cargo-near 0.22.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf --retry 10 --retry-all-errors --retry-delay 15 \
            -o "$RUNNER_TEMP/cargo-near.tar.gz" \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          echo "9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a  $RUNNER_TEMP/cargo-near.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cargo-near"
          tar xzf "$RUNNER_TEMP/cargo-near.tar.gz" --no-same-owner --strip-components 1 -C "$RUNNER_TEMP/cargo-near"
          install -m 755 "$RUNNER_TEMP/cargo-near/cargo-near" "$HOME/.cargo/bin/cargo-near"
          command -v cargo-near
      - name: Build the wasm
        run: cargo near build non-reproducible-wasm --locked
      - uses: actions/upload-artifact@v4
        with:
          name: satchel-wasm
          path: contracts/satchel/target/near/satchel.wasm

  reproducible:
    name: Reproducible build and code hash
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # cargo-near records the commit it builds as the source (NEP-330), so build the branch
      # commit, which stays on GitHub, not the pull request's temporary merge commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The release binary itself, checked against the sha256 that cargo-near's own 0.22.0 installer
      # pins. GitHub's release downloads sometimes answer runners with a 504 and that installer does not
      # retry, so download it here with retries; the step fails if the file never arrives or differs.
      - name: Install cargo-near 0.22.0
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf --retry 10 --retry-all-errors --retry-delay 15 \
            -o "$RUNNER_TEMP/cargo-near.tar.gz" \
            https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          echo "9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a  $RUNNER_TEMP/cargo-near.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/cargo-near"
          tar xzf "$RUNNER_TEMP/cargo-near.tar.gz" --no-same-owner --strip-components 1 -C "$RUNNER_TEMP/cargo-near"
          install -m 755 "$RUNNER_TEMP/cargo-near/cargo-near" "$HOME/.cargo/bin/cargo-near"
          command -v cargo-near
      - name: Build in the pinned Docker image
        run: cargo near build reproducible-wasm
      - name: Code hash
        working-directory: .
        run: |
          hash="$(node scripts/code-hash.mjs contracts/satchel/target/near/satchel.wasm)"
          echo "$hash" > contracts/satchel/target/near/satchel.code-hash.txt
          {
            echo "### Satchel reproducible build"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- code hash: \`$hash\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: satchel-reproducible-wasm
          path: |
            contracts/satchel/target/near/satchel.wasm
            contracts/satchel/target/near/satchel.code-hash.txt
          if-no-files-found: error
          retention-days: 90
