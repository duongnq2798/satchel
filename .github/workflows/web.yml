name: Web

# Pull requests run this through ci.yml, on every pull request, whatever it touches.
on:
  push:
    branches: [main, dev]
    # The app runs on packages/satchel-nft, so a change there rebuilds it too.
    paths: ["web/**", "packages/**", "package.json", "package-lock.json", ".github/workflows/web.yml"]
  workflow_call:

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      # One lockfile at the root installs both workspaces: the app and the package it runs on.
      - run: npm ci
        working-directory: .
      # The demo kit's lengths, tags, timings and pages (docs/DEMO.md). Node only, no network.
      - run: node scripts/check-demo-kit.mjs
        working-directory: .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
