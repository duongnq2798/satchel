name: Web

# Pull requests run this through ci.yml, on every pull request, whatever it touches.
on:
  push:
    branches: [main, dev]
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_call:

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
