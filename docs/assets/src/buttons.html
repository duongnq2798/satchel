<!doctype html>
<!-- The README's buttons, 300 x 52 each. render.mjs renders one per file: buttons.html#try, #evaluate, #claims. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 300px; height: 52px; overflow: hidden; background: transparent; font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { width: 300px; height: 52px; border-radius: 26px; display: none; align-items: center; gap: 12px; padding: 0 20px; text-decoration: none; }
  a.on { display: flex; }
  .dark { background: #17140f; color: #f5f0e6; }
  .gold { background: #ce9b2f; color: #17140f; }
  .line { background: #fbf8f2; color: #17140f; box-shadow: inset 0 0 0 1.5px #17140f; }
  svg { flex: none; width: 22px; height: 22px; }
  b { display: block; font-size: 15px; font-weight: 600; line-height: 1.2; }
  small { display: block; font-size: 11.5px; font-weight: 500; opacity: .8; line-height: 1.3; }
  /* Ink at 80% on gold is 5.2:1; solid ink is 7.31:1. */
  .gold small { opacity: 1; }
</style>
</head>
<body>
  <a id="try" class="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span><b>Try it live</b><small>satchelnft.xyz · reading needs no wallet</small></span></a>
  <a id="evaluate" class="gold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg><span><b>Evaluate in 5 minutes</b><small>no wallet, no key, no account</small></span></a>
  <a id="claims" class="line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg><span><b>Check every claim</b><small>33 claims read from the chains, Node 22</small></span></a>
  <script>document.getElementById(location.hash.slice(1) || "try").classList.add("on");</script>
</body>
</html>
